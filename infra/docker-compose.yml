name: wavelength

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: wavelength
      POSTGRES_PASSWORD: wavelength   # only for local dev
      POSTGRES_DB: wavelength
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavelength"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://wavelength:wavelength@db:5432/wavelength
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # phoenix for tracing, open http://localhost:6006
  phoenix:
    image: arizephoenix/phoenix:version-11.0.0
    ports:
      - "6006:6006"

volumes:
  pgdata:
