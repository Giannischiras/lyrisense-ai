[project]
name = "lyrisense"
version = "0.1.0"
description = "AI music agent: mood -> playlist via hybrid RAG, LangGraph agent and MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "fastembed>=0.5",
    "pgvector>=0.3",
    "numpy>=2.5.4",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "langgraph>=0.2",
    "openai>=1.50",
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# WHERE clauses are composed from fixed fragments; every value is a %s parameter
# (asserted in tests/test_rag_unit.py::test_filters_sql_parametrised).
"app/rag/search.py" = ["S608"]
